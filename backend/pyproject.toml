[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaani-rakshak-backend"
version = "0.1.0"
description = "VAANI-RAKSHAK R2 — Backend & Data Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Validation & serialisation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Structured logging
    "structlog>=24.4.0",

    # Async HTTP client (used later for inter-service calls)
    "httpx>=0.27.0",

    # Kafka (aiokafka for async producer/consumer — Phase 2)
    "aiokafka>=0.11.0",

    # Utility
    "python-ulid>=2.0.0",
    "tenacity>=9.0.0",

    # Audio processing (for telephony simulation — Phase 7)
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient transport

    # Linting & formatting
    "ruff>=0.6.0",

    # Type checking
    "mypy>=1.11.0",

    # Stubs
]

ml = [
    # ML adapter scaffold (Phase 4) — install when R1 models arrive
    "onnxruntime>=1.19.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (partial)
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "ANN204",  # missing __init__ return annotation
    "S101",    # use of assert — allowed in tests
    "S104",    # binding to 0.0.0.0 — intentional for container
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"app/detection/**/*.py" = ["ANN"]  # Mock adapters have relaxed annotation rules

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "structlog.*", "scipy.*", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "-v",
]
log_cli = true
log_cli_level = "INFO"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
